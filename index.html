<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>驚喜製造機</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🚗 驚喜製造機</h1>
    
    <div class="status-board">
      <div class="status-item">
        <span class="icon">📚</span>
        <span class="label">題庫：</span>
        <span id="data-status" class="status-text loading">載入中...</span>
      </div>
      <div class="status-item">
        <span class="icon">📍</span>
        <span class="label">GPS：</span>
        <span id="gps-status" class="status-text waiting">等待啟動</span>
      </div>
      <div class="status-item">
        <span class="icon">🎯</span>
        <span class="label">下個驚喜：</span>
        <span id="nearest-status" class="status-text waiting">計算中...</span>
      </div>
    </div>

    <button id="start-btn" disabled>啟動系統</button>
    <button id="test-btn" style="display: none; background-color: #2196F3; color: white; border: none; border-radius: 50px; padding: 15px 20px; font-size: 18px; margin-top: 15px; width: 100%; cursor: pointer;">🧪 測試語音播報</button>
    <button id="reset-btn" style="display: none;">🔄 重置播報進度</button>
  </div>

  <audio id="chime-sound" src="chime.mp3" preload="auto"></audio>
  <audio id="countdown-sound" src="countdown.mp3" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
