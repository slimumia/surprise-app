<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>驚喜製造機</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🚗 驚喜製造機</h1>
    
    <div class="status-board">
      <div class="status-item">
        <span class="icon">📚</span>
        <span class="label">題庫狀態：</span>
        <span id="data-status" class="status-text loading">載入中...</span>
      </div>
      <div class="status-item">
        <span class="icon">📍</span>
        <span class="label">GPS 定位：</span>
        <span id="gps-status" class="status-text waiting">等待啟動</span>
      </div>
    </div>

    <button id="start-btn" disabled>啟動系統</button>
  </div>

  <!-- 加入音效元素 (隱藏在背景) -->
  <audio id="chime-sound" src="chime.mp3" preload="auto"></audio>
  <audio id="countdown-sound" src="countdown.mp3" preload="auto"></audio>

  <script src="app.js"></script>
</body>
</html>
